name: daily-fetch

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = KST 06:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and filter
        env:
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
        run: python scripts/fetch_odcloud.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/status.json
          git diff --cached --quiet || git commit -m "update data $(date -u +%F)"
          git push
